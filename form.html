<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <main>
      <h1>PHP FORM</h1>
    <form action="">
      <div id="pop">
        <label for="name"><strong>Name:</strong></label>
      <input type="text" placeholder="FIRST" id="first" required>
      <input type="text" placeholder="SECOND" id="second" required><br>
      <label for="email"><strong>email:</strong></label>
      <input type="email" id="email" placeholder="Example123@gmail.com" required><br>
      <label for="password"><strong>password:</strong></label>
      <input type="password"  id="pass" minlength="9" required><br>
      <label for="phone">phone number:</label>
      <input type="tel" id="phone" placeholder="###-###-###"><br>
      <label for="date"><strong>Date:</strong></label>
      <input type="date" id="date"><br>
      <label for="gender">Male</label><input type="radio" name="gender" id="male" value="male" required>
      <label for="gender">Female</label><input type="radio" name="gender" id="female" value="female" required><br>
      <label for="continent">Continent:</label>
      <select name="Region" id="conti">
        <option value="Europe">Europe</option>
        <option value="Africa">Africa</option>
        <option value="Asia">Asia</option>
        <option value="America">America</option>
      </select>
      <input type="text" name="continet" id="country" placeholder="Country" required><br>
      <button type = "reset" id="reset">Reset</button>
      <button type="submit" id="submit">Submit</button>
      </div>
    </form>
    </main>
</body>

</html>
